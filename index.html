<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Polar Buzz Shooter #KGNINJA</title>
  <style>
    /* #KGNINJA */
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0ff;
      font-family: monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// #KGNINJA
// 日本語コメント必須: ゲーム全体の状態とループ処理を管理する
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  let width, height;

  // 日本語コメント: キー入力の状態を保持する
  const keys = new Set();
  let shiftHeld = false;

  // 日本語コメント: 属性の定数表現
  const POLARITY = {
    CYAN: "cyan",
    MAGENTA: "magenta",
  };

  // 日本語コメント: プレイヤーの初期状態
  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    speed: 280,
    radius: 18,
    polarity: POLARITY.CYAN,
    energy: 0,
    energyMax: 100,
    hp: 8,
    hpMax: 12,
    buzzCount: 0,
    overdrive: false,
    overdriveTimer: 0,
    // 日本語コメント: バズ演出の残存時間
    buzzEffectTimer: 0,
  };

  // 日本語コメント: 敵と弾のコンテナ
  const enemies = [];
  const enemyBullets = [];
  const playerBullets = [];

  // 日本語コメント: ゲームの進行状態
  const gameState = {
    progress: 0,
    midbossSpawned: false,
    midbossCleared: false,
    bossSpawned: false,
    bossCleared: false,
    debugMode: false,
    gameOver: false,
  };

  // 日本語コメント: スコアおよびBUZZステータス
  let score = 0;
  let buzzMultiplier = 1;
  const buzzThreshold = 5;
  const overdriveDuration = 8000;
  // 日本語コメント: バズ演出の持続秒数
  const buzzEffectDuration = 0.35;
  const afterglow = 0.08;
  const midbossThreshold = 45;
  const bossThreshold = 110;

  // 日本語コメント: 走査線風背景の状態
  let scanOffset = 0;

  // 日本語コメント: オーディオ初期化
  const audioState = {
    context: null,
  };

  function initAudio() {
    if (audioState.context) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioState.context = new AudioContext();
  }

  function playTone(freq, duration, type = "sine") {
    if (!audioState.context) return;
    const ctx = audioState.context;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.05);
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * DPR;
    canvas.height = height * DPR;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.x = width * 0.5;
    player.y = height * 0.8;
  }

  window.addEventListener("resize", resize);
  resize();

  // 日本語コメント: キー入力イベント
  window.addEventListener("keydown", (e) => {
    keys.add(e.key.toLowerCase());
    if (e.key === "Shift" && !shiftHeld) {
      shiftHeld = true;
      togglePolarity();
    }
    if (e.key === "F1") {
      // 日本語コメント: デバッグモード切替 (無敵トグル)
      e.preventDefault();
      gameState.debugMode = !gameState.debugMode;
      playTone(gameState.debugMode ? 960 : 320, 0.2, "square");
    }
    if (!audioState.context) {
      initAudio();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys.delete(e.key.toLowerCase());
    if (e.key === "Shift") {
      shiftHeld = false;
    }
  });

  function togglePolarity() {
    // 日本語コメント: プレイヤー属性をトグルし、UI音を出す
    player.polarity =
      player.polarity === POLARITY.CYAN ? POLARITY.MAGENTA : POLARITY.CYAN;
    playTone(player.polarity === POLARITY.CYAN ? 420 : 210, 0.15, "triangle");
  }

  // 日本語コメント: プレイヤーの動きを更新
  function updatePlayer(dt) {
    if (gameState.gameOver) return;
    let inputX = 0;
    let inputY = 0;
    if (keys.has("arrowleft") || keys.has("a")) inputX -= 1;
    if (keys.has("arrowright") || keys.has("d")) inputX += 1;
    if (keys.has("arrowup") || keys.has("w")) inputY -= 1;
    if (keys.has("arrowdown") || keys.has("s")) inputY += 1;
    const len = Math.hypot(inputX, inputY);
    if (len > 0) {
      inputX /= len;
      inputY /= len;
    }
    const speed = player.speed * (player.overdrive ? 1.1 : 1);
    player.vx = inputX * speed;
    player.vy = inputY * speed;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));
  }

  // 日本語コメント: プレイヤー弾を定期的に発射
  let shotTimer = 0;
  const shotInterval = 0.12;
  function handlePlayerShooting(dt) {
    if (gameState.gameOver) return;
    shotTimer -= dt;
    if (shotTimer <= 0) {
      shotTimer = shotInterval * (player.overdrive ? 0.6 : 1);
      spawnPlayerBullet();
    }
  }

  function spawnPlayerBullet() {
    playerBullets.push({
      x: player.x,
      y: player.y - player.radius,
      vx: 0,
      vy: -420,
      polarity: player.polarity,
      life: 2,
    });
    playTone(player.polarity === POLARITY.CYAN ? 660 : 520, 0.08, "square");
  }

  // 日本語コメント: 敵生成ロジック
  let enemyTimer = 0;
  const enemyInterval = 1.8;
  function handleEnemySpawn(dt) {
    if (gameState.gameOver) return;
    if (hasEliteActive("midboss") || hasEliteActive("boss")) return;
    enemyTimer -= dt;
    if (enemyTimer <= 0) {
      enemyTimer = enemyInterval * (0.7 + Math.random() * 0.6);
      spawnEnemy();
    }
  }

  function spawnEnemy() {
    const polarity =
      Math.random() > 0.5 ? POLARITY.CYAN : POLARITY.MAGENTA;
    enemies.push({
      x: Math.random() * width,
      y: -40,
      vx: (Math.random() - 0.5) * 60,
      vy: 60 + Math.random() * 80,
      polarity,
      shotTimer: 0.6 + Math.random() * 0.8,
      alive: true,
      type: "normal",
      hp: 1,
    });
  }

  function spawnMidboss() {
    const polarity =
      Math.random() > 0.5 ? POLARITY.CYAN : POLARITY.MAGENTA;
    enemies.push({
      x: width * 0.5,
      y: height * 0.28,
      vx: 90,
      vy: 0,
      polarity,
      shotTimer: 0.45,
      alive: true,
      type: "midboss",
      hp: 20,
      age: 0,
    });
    playTone(320, 0.5, "square");
  }

  function spawnBoss() {
    const polarity =
      Math.random() > 0.5 ? POLARITY.CYAN : POLARITY.MAGENTA;
    enemies.push({
      x: width * 0.5,
      y: height * 0.2,
      vx: 70,
      vy: 0,
      polarity,
      shotTimer: 0.35,
      alive: true,
      type: "boss",
      hp: 45,
      age: 0,
      sweepDir: 1,
    });
    playTone(160, 0.7, "square");
  }

  function hasEliteActive(type) {
    return enemies.some((enemy) => enemy.type === type && enemy.alive);
  }

  function updateGameFlow(dt) {
    if (gameState.gameOver) return;
    gameState.progress += dt;
    if (!gameState.midbossSpawned && gameState.progress >= midbossThreshold) {
      spawnMidboss();
      gameState.midbossSpawned = true;
    }
    if (
      gameState.midbossSpawned &&
      !gameState.midbossCleared &&
      !hasEliteActive("midboss")
    ) {
      gameState.midbossCleared = true;
    }
    if (
      gameState.midbossCleared &&
      !gameState.bossSpawned &&
      gameState.progress >= bossThreshold
    ) {
      spawnBoss();
      gameState.bossSpawned = true;
    }
    if (gameState.bossSpawned && !gameState.bossCleared && !hasEliteActive("boss")) {
      gameState.bossCleared = true;
    }
  }

  function updateEnemies(dt) {
    enemies.forEach((enemy) => {
      enemy.age = (enemy.age || 0) + dt;
      if (enemy.type === "normal") {
        enemy.x += enemy.vx * dt;
        enemy.y += enemy.vy * dt;
        if (enemy.x < 20 || enemy.x > width - 20) enemy.vx *= -1;
      } else if (enemy.type === "midboss") {
        enemy.x += enemy.vx * dt;
        if (enemy.x < width * 0.2 || enemy.x > width * 0.8) {
          enemy.vx *= -1;
        }
        enemy.y = height * 0.28 + Math.sin(enemy.age * 1.6) * 26;
      } else if (enemy.type === "boss") {
        enemy.x += enemy.vx * dt;
        if (enemy.x < width * 0.18 || enemy.x > width * 0.82) {
          enemy.vx *= -1;
        }
        enemy.y = height * 0.2 + Math.sin(enemy.age * 1.2) * 22;
        enemy.vx += Math.sin(enemy.age * 0.8) * 12 * dt * (enemy.sweepDir || 1);
        enemy.vx = Math.max(-140, Math.min(140, enemy.vx));
      }
      enemy.shotTimer -= dt;
      if (enemy.shotTimer <= 0) {
        enemy.shotTimer =
          enemy.type === "normal"
            ? 0.6 + Math.random() * 1.0
            : enemy.type === "midboss"
            ? 0.35
            : 0.28;
        spawnEnemyBurst(enemy);
      }
      if (enemy.type === "normal" && enemy.y > height + 40) {
        enemy.alive = false;
      }
    });
  }

  function spawnEnemyBurst(enemy) {
    if (enemy.type === "midboss") {
      spawnMidbossPattern(enemy);
      return;
    }
    if (enemy.type === "boss") {
      spawnBossPattern(enemy);
      return;
    }
    // 日本語コメント: 自機方向に正確な弾幕を敷くための正規化ベクトル計算
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.hypot(dx, dy) || 1;
    const forwardX = dx / dist;
    const forwardY = dy / dist;
    const perpX = -forwardY;
    const perpY = forwardX;
    const columns = 7;
    const rows = 4;
    const columnSpacing = 64;
    const rowSpacing = 44;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {
        const colOffset = col - (columns - 1) / 2;
        if (row % 2 === 1 && col === Math.floor(columns / 2)) {
          // 日本語コメント: 中央に回廊を空けて迷路状の避け方を演出
          continue;
        }
        const spawnX =
          enemy.x +
          forwardX * rowSpacing * row +
          perpX * columnSpacing * colOffset;
        const spawnY =
          enemy.y +
          forwardY * rowSpacing * row +
          perpY * columnSpacing * colOffset;
        const speed = 140 + row * 18;
        const polarity = enemy.polarity; // 日本語コメント: 敵弾の属性は常に敵本体と一致させる
        enemyBullets.push({
          x: spawnX,
          y: spawnY,
          vx: forwardX * speed,
          vy: forwardY * speed,
          polarity,
          life: 10,
          buzzed: false,
        });
      }
    }
    playTone(enemy.polarity === POLARITY.CYAN ? 180 : 260, 0.1, "sawtooth");
  }

  function spawnMidbossPattern(enemy) {
    // 日本語コメント: 中ボスは扇状弾を連続射出し緩やかな迷路を形成
    const volley = 12;
    for (let i = 0; i < volley; i++) {
      const angle =
        Math.atan2(player.y - enemy.y, player.x - enemy.x) +
        (i - (volley - 1) / 2) * 0.12;
      const speed = 160 + (i % 3) * 20;
      enemyBullets.push({
        x: enemy.x,
        y: enemy.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        polarity: enemy.polarity,
        life: 12,
        buzzed: false,
      });
    }
    // 日本語コメント: 中央にゆっくりと進むレーザーフレーム
    const laneWidth = 120;
    for (let offset = -1; offset <= 1; offset += 2) {
      enemyBullets.push({
        x: enemy.x + laneWidth * offset,
        y: enemy.y,
        vx: 0,
        vy: 110,
        polarity: enemy.polarity,
        life: 12,
        buzzed: false,
      });
    }
    playTone(enemy.polarity === POLARITY.CYAN ? 200 : 240, 0.3, "triangle");
  }

  function spawnBossPattern(enemy) {
    // 日本語コメント: ボスは螺旋と格子状レーザーを組み合わせた弾幕を展開
    const spiralShots = 24;
    for (let i = 0; i < spiralShots; i++) {
      const phase = enemy.age * 2 + i * 0.26;
      const angle = phase % (Math.PI * 2);
      const speed = 170 + Math.sin(phase * 0.5) * 40;
      enemyBullets.push({
        x: enemy.x,
        y: enemy.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        polarity: enemy.polarity,
        life: 14,
        buzzed: false,
      });
    }
    const gridSpan = 4;
    const spacing = 120;
    for (let gx = -gridSpan; gx <= gridSpan; gx++) {
      if (Math.abs(gx) === 1) continue;
      enemyBullets.push({
        x: enemy.x + gx * spacing,
        y: enemy.y,
        vx: 0,
        vy: 90 + Math.abs(gx) * 8,
        polarity: enemy.polarity,
        life: 18,
        buzzed: false,
      });
    }
    playTone(enemy.polarity === POLARITY.CYAN ? 150 : 210, 0.4, "triangle");
  }

  function updatePlayerBullets(dt) {
    playerBullets.forEach((b) => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
    });
  }

  function updateEnemyBullets(dt) {
    enemyBullets.forEach((b) => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (!player.overdrive && b.life < 0) b.life = -1;
    });
  }

  function handleCollisions(dt) {
    if (gameState.gameOver) return;
    // 日本語コメント: プレイヤー弾と敵の衝突
    playerBullets.forEach((bullet) => {
      enemies.forEach((enemy) => {
        if (!enemy.alive) return;
        const hitRadius =
          enemy.type === "normal"
            ? 28
            : enemy.type === "midboss"
            ? 60
            : 72;
        const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
        if (dist < hitRadius) {
          if (bullet.polarity === enemy.polarity) {
            // 日本語コメント: 同属性の弾は敵を倒せず霧散させる
            bullet.life = -1;
            playTone(240, 0.05, "sine");
          } else {
            enemy.hp -= 1;
            bullet.life = -1;
            if (enemy.hp <= 0) {
              enemy.alive = false;
              const bonus =
                enemy.type === "normal"
                  ? 120
                  : enemy.type === "midboss"
                  ? 2200
                  : 6800;
              score += Math.floor(bonus * buzzMultiplier);
              playTone(720, 0.12, "triangle");
              if (enemy.type !== "normal") {
                playTone(540, 0.18, "sawtooth");
              }
            } else {
              score += Math.floor(60 * buzzMultiplier);
              playTone(480, 0.08, "triangle");
            }
          }
        }
      });
    });

    // 日本語コメント: 敵弾とプレイヤーの処理
    enemyBullets.forEach((bullet) => {
      const dist = Math.hypot(bullet.x - player.x, bullet.y - player.y);
      if (dist < player.radius * 0.6) {
        if (bullet.polarity === player.polarity) {
          bullet.life = -1;
          absorbEnergy(12);
          changeHP(1);
        } else {
          // 日本語コメント: ダメージ代わりにエネルギー減とスコア減少
          bullet.life = -1;
          if (gameState.debugMode) {
            playTone(180, 0.12, "sine");
            return;
          }
          player.energy = Math.max(0, player.energy - 18);
          score = Math.max(0, score - 500);
          player.overdrive = false;
          playTone(90, 0.25, "sawtooth");
          changeHP(-1);
        }
      } else if (
        bullet.polarity !== player.polarity &&
        dist < player.radius * 2.4 &&
        !bullet.buzzed
      ) {
        bullet.buzzed = true;
        registerBuzz(dist / (player.radius * 2.4));
      }
    });
  }

  function absorbEnergy(amount) {
    player.energy = Math.min(player.energyMax, player.energy + amount);
    score += 30 * buzzMultiplier;
    playTone(520, 0.2, "sine");
    if (player.energy >= player.energyMax && !player.overdrive) {
      triggerOverdrive();
      player.energy = player.energyMax * 0.5;
    }
  }

  function changeHP(amount) {
    // 日本語コメント: ヒットポイントの増減とデバッグ無敵判定
    if (amount < 0 && gameState.debugMode) return;
    player.hp = Math.max(0, Math.min(player.hpMax, player.hp + amount));
    if (player.hp <= 0 && !gameState.gameOver) {
      triggerGameOver();
    }
  }

  function triggerGameOver() {
    // 日本語コメント: ゲームオーバー時の処理とサウンド
    gameState.gameOver = true;
    player.overdrive = false;
    buzzMultiplier = 1;
    playTone(70, 0.5, "sawtooth");
  }

  function registerBuzz(proximityRatio) {
    const gain = 1 + (1 - proximityRatio) * 1.8;
    score += Math.floor(80 * gain * buzzMultiplier);
    player.buzzCount += 1;
    // 日本語コメント: 自機側にバズ演出を適用
    player.buzzEffectTimer = buzzEffectDuration;
    playTone(880, 0.1, "triangle");
    if (player.buzzCount >= buzzThreshold) {
      player.buzzCount = 0;
      triggerOverdrive();
    }
  }

  function triggerOverdrive() {
    player.overdrive = true;
    player.overdriveTimer = overdriveDuration;
    buzzMultiplier = 3;
    playTone(1200, 0.4, "square");
  }

  function updateOverdrive(dt) {
    if (gameState.gameOver) return;
    if (player.overdrive) {
      player.overdriveTimer -= dt * 1000;
      if (player.overdriveTimer <= 0) {
        player.overdrive = false;
        buzzMultiplier = 1;
      }
    }
  }

  function updateBuzzEffect(dt) {
    // 日本語コメント: バズ演出の残時間を減衰させる
    if (player.buzzEffectTimer > 0) {
      player.buzzEffectTimer = Math.max(0, player.buzzEffectTimer - dt);
    }
  }

  function cleanupEntities() {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
      if (playerBullets[i].life <= 0 || playerBullets[i].y < -40) {
        playerBullets.splice(i, 1);
      }
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (b.life <= 0 || b.y > height + 60 || b.x < -60 || b.x > width + 60) {
        enemyBullets.splice(i, 1);
      }
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (!enemies[i].alive) enemies.splice(i, 1);
    }
  }

  function drawBackground(dt) {
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${afterglow})`;
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = "rgba(0, 255, 255, 0.04)";
    ctx.lineWidth = 1;
    scanOffset += dt * 120;
    ctx.beginPath();
    for (let y = (scanOffset % 20); y < height; y += 20) {
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    if (gameState.gameOver) return;
    ctx.save();
    ctx.translate(player.x, player.y);
    if (player.buzzEffectTimer > 0) {
      // 日本語コメント: バズ時は自機周囲に発光輪郭を描画
      const t = player.buzzEffectTimer / buzzEffectDuration;
      const glowRadius = player.radius * (1.4 + (1 - t) * 0.3);
      const outerAlpha = 0.25 + 0.4 * t;
      const innerAlpha = 0.15 + 0.25 * t;
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(255,240,120,${outerAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = `rgba(0,200,255,${innerAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius * 0.65, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = player.polarity === POLARITY.CYAN ? "#00ffff" : "#ff00ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -player.radius);
    ctx.lineTo(player.radius * 0.6, player.radius);
    ctx.lineTo(0, player.radius * 0.4);
    ctx.lineTo(-player.radius * 0.6, player.radius);
    ctx.closePath();
    ctx.stroke();

    // 日本語コメント: シールド輪郭
    ctx.beginPath();
    ctx.arc(0, 0, player.radius * 1.2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.stroke();
    ctx.restore();
  }

  function drawEnemies() {
    ctx.lineWidth = 2;
    enemies.forEach((enemy) => {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.strokeStyle = enemy.polarity === POLARITY.CYAN ? "#0099ff" : "#ff33ff";
      if (enemy.type === "normal") {
        ctx.beginPath();
        ctx.moveTo(-14, -18);
        ctx.lineTo(14, -18);
        ctx.lineTo(20, 6);
        ctx.lineTo(0, 20);
        ctx.lineTo(-20, 6);
        ctx.closePath();
        ctx.stroke();
      } else if (enemy.type === "midboss") {
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-34, -30);
        ctx.lineTo(34, -30);
        ctx.lineTo(52, 12);
        ctx.lineTo(0, 46);
        ctx.lineTo(-52, 12);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
      } else if (enemy.type === "boss") {
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, 60, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-52, -52);
        ctx.lineTo(52, 52);
        ctx.moveTo(52, -52);
        ctx.lineTo(-52, 52);
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawBullets() {
    ctx.lineWidth = 2;
    playerBullets.forEach((b) => {
      ctx.strokeStyle = b.polarity === POLARITY.CYAN ? "#00ffee" : "#ff66ff";
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + 12);
      ctx.stroke();
    });
    enemyBullets.forEach((b) => {
      ctx.strokeStyle = b.polarity === POLARITY.CYAN ? "#0066ff" : "#ff00aa";
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + b.vx * 0.05, b.y + b.vy * 0.05);
      ctx.stroke();
    });
  }

  function drawHUD() {
    ctx.save();
    ctx.strokeStyle = "#00c8ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.rect(20, height - 60, 200, 24);
    ctx.stroke();
    ctx.beginPath();
    const energyWidth = (player.energy / player.energyMax) * 200;
    ctx.strokeStyle = "#00ffff";
    ctx.moveTo(22, height - 48);
    ctx.lineTo(22 + energyWidth, height - 48);
    ctx.stroke();

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.strokeText(`SCORE ${score.toString().padStart(8, "0")}`, 20, 40);
    ctx.strokeText(
      `MODE ${player.overdrive ? "OVERDRIVE" : "NORMAL"}`,
      20,
      70
    );
    ctx.strokeText(`BUZZ ${player.buzzCount}/${buzzThreshold}`, 20, 100);
    ctx.strokeText(`POL ${player.polarity.toUpperCase()}`, 20, 130);
    ctx.strokeText(`HP ${player.hp.toFixed(0)}/${player.hpMax}`, 20, 160);
    const phaseLabel = gameState.gameOver
      ? "GAME OVER"
      : hasEliteActive("boss")
      ? "BOSS"
      : hasEliteActive("midboss")
      ? "MIDBOSS"
      : gameState.bossCleared
      ? "CLEAR"
      : "ENGAGE";
    ctx.strokeText(`STATE ${phaseLabel}`, 20, 190);
    if (gameState.debugMode) {
      ctx.strokeText(`DEBUG ON`, 20, 220);
    } else {
      ctx.strokeText(`F1 DEBUG`, 20, 220);
    }
    ctx.restore();
  }

  function drawWireframeBorder() {
    ctx.save();
    ctx.strokeStyle = "rgba(0,255,255,0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(12, 12, width - 24, height - 24);
    ctx.stroke();
    ctx.restore();
  }

  function drawGameOverOverlay() {
    if (!gameState.gameOver) return;
    ctx.save();
    ctx.strokeStyle = "rgba(255, 0, 80, 0.85)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x - 40, player.y - 40);
    ctx.lineTo(player.x + 40, player.y + 40);
    ctx.moveTo(player.x + 40, player.y - 40);
    ctx.lineTo(player.x - 40, player.y + 40);
    ctx.stroke();
    ctx.font = "48px monospace";
    ctx.strokeText("GAME OVER", width * 0.3, height * 0.5);
    ctx.font = "24px monospace";
    ctx.strokeText("F1: DEBUG MODE / SHIFT: POLARITY", width * 0.16, height * 0.57);
    ctx.restore();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;

    drawBackground(dt);
    if (!gameState.gameOver) {
      updateGameFlow(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updatePlayerBullets(dt);
      updateEnemyBullets(dt);
      handleCollisions(dt);
      handlePlayerShooting(dt);
      handleEnemySpawn(dt);
      updateOverdrive(dt);
    }
    updateBuzzEffect(dt);
    cleanupEntities();
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawHUD();
    drawWireframeBorder();
    drawGameOverOverlay();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
